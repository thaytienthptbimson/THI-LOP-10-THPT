<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn thi lớp 10 THPT 2026-2027</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--ok:#16a34a;--no:#dc2626;--bg:#f4f5fb;--c:#fff;--t:#1e1b4b;--m:#6b7280;--l:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0003}
header h1{margin:0;font-size:1.05rem;letter-spacing:.3px}
.bar{height:6px;background:#fff3;border-radius:9px;margin:8px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:#fde047;transition:width .3s}
nav{display:flex;gap:6px}nav button{flex:1;border:0;background:#fff2;color:#fff;padding:11px 6px;font:600 .95rem inherit;border-radius:12px 12px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--p)}
main{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.g{background:var(--c);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px #0001}
.g h2{margin:0 0 10px;font-size:1.02rem}.g small{color:var(--m);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ex{border:2px solid var(--l);background:#fff;border-radius:12px;min-height:56px;font:600 .9rem inherit;color:var(--t);cursor:pointer;padding:6px}
.ex.open{border-color:var(--p);background:#eef2ff}.ex.done{border-color:var(--ok);background:#f0fdf4;color:var(--ok)}
.ex.lock,.ex.soon{opacity:.5;cursor:not-allowed;background:#f3f4f6}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.btn{border:0;background:var(--p);color:#fff;font:700 1rem inherit;padding:13px 20px;border-radius:12px;cursor:pointer;min-height:48px}
.btn.s{background:#fff;color:var(--p);border:2px solid var(--p)}
.q{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid transparent;box-shadow:0 1px 6px #0001}
.q.ok{border-color:var(--ok)}.q.no{border-color:var(--no)}
.p{background:#fffbeb;border-left:4px solid #f59e0b;padding:10px 12px;border-radius:8px;margin-bottom:10px;white-space:pre-line;font-size:.95rem}
.n{font-weight:700;color:var(--p);margin-right:6px}
.o{display:block;width:100%;text-align:left;border:2px solid var(--l);background:#fff;border-radius:10px;padding:12px;margin-top:8px;font:inherit;color:inherit;min-height:48px;cursor:pointer}
.o.sel{border-color:var(--p);background:#eef2ff}.o.right{border-color:var(--ok);background:#f0fdf4}.o.wrong{border-color:var(--no);background:#fef2f2}
input.f{width:100%;margin-top:8px;border:2px solid var(--l);border-radius:10px;padding:12px;font:inherit;min-height:48px}
input.f:focus{outline:0;border-color:var(--p)}
.e{margin-top:8px;font-size:.92rem;color:var(--m)}.e b{color:var(--no)}
.fix{position:fixed;left:0;right:0;bottom:0;background:#fffe;backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0002;display:flex;gap:10px;align-items:center;z-index:6}
.fix .btn{flex:1;max-width:420px;margin:0 auto}
.res{text-align:center;padding:18px;border-radius:16px;margin-bottom:14px;color:#fff;font-weight:700}
.res.ok{background:var(--ok)}.res.no{background:var(--no)}
#tm{font-weight:700;color:var(--no)}
</style></head><body>
<header><h1>🎓 ÔN THI LỚP 10 THPT 2026-2027</h1><div class="bar"><i id="pb"></i></div>
<nav id="nav"></nav></header><main id="app"></main>
<script>
/* ===== DỮ LIỆU ===== M(câu,[A,B,C,D],đáp án đúng 0-3,giải thích) | F(câu,đáp án hoặc [nhiều đáp án],giải thích)
   Mỗi bài = mảng câu hỏi (20 câu). Bài rỗng [] = "Sắp có". Thêm {p:"đoạn văn"} vào câu đầu của đoạn để hiện bài đọc. */
const M=(q,o,a,e,p)=>({q,o,a,e,p}),F=(q,a,e,p)=>({q,a:[].concat(a),e,p}),E=n=>Array.from({length:n},()=>[]);
const DATA=[
{name:"📘 Ngữ pháp",groups:[
{t:"Thì & dạng của động từ",ex:[[
F("My father (jog) ______ in the park every morning.","jogs","Hiện tại đơn, chủ ngữ số ít → jogs"),
F("They (cook) ______ dinner when the light went out.","were cooking","Hành động đang diễn ra thì bị cắt ngang → quá khứ tiếp diễn"),
F("The students enjoy (play) ______ soccer after school.","playing","enjoy + V-ing"),
F("My teacher suggested that we (collect) ______ waste paper.",["collect","should collect"],"suggest that + S + (should) + V nguyên mẫu"),
F("I (have) ______ a calculator, I would lend it to you now.","had","Câu điều kiện loại 2 → if + V quá khứ")
],...E(4)]},
{t:"Câu điều kiện & Wish",ex:E(5)},{t:"Mệnh đề quan hệ",ex:[[
M("The new film is about a poor little girl ______ can speak several languages.",["who","whose","whom","which"],0,"Thay cho người, làm chủ ngữ → who"),
M("I know a restaurant ______ serves excellent sushi.",["who","which","whom","whose"],1,"Thay cho vật, làm chủ ngữ → which")
],...E(4)]},
{t:"So sánh",ex:[[
M("Mai drives ______ than her brother.",["more carefully","as careful","carefully","more careful"],0,"Trạng từ dài so sánh hơn: more + adv + than")
],...E(4)]},
{t:"Mạo từ & Giới từ",ex:[[
M("She gave me ______ orange yesterday.",["a","an","the","Ø"],1,"orange bắt đầu bằng nguyên âm, nhắc lần đầu → an"),
M("She has a meeting ______ Monday, but I’m not sure.",["at","in","on","to"],2,"on + thứ trong tuần")
],...E(4)]},
{t:"Liên từ (because / although / despite)",ex:[[
M("We missed the bus this morning ______ we got up late.",["despite","although","because","because of"],2,"Sau chỗ trống là một mệnh đề chỉ nguyên nhân → because")
],...E(4)]},
{t:"Câu tường thuật",ex:E(5)},{t:"used to, such…that, run out of, give priority to…",ex:E(5)}]},
{name:"🧩 Dạng bài",groups:[
{t:"Dạng 1 – Ngữ âm, Từ vựng & Ngữ pháp (Part A + B)",ex:[[
M("Chọn từ có phần gạch chân phát âm khác: (-ed)",["needed","looked","helped","watched"],0,"needed đọc /ɪd/, còn lại /t/"),
M("Chọn từ có phần gạch chân phát âm khác: (th)",["think","thin","thank","though"],3,"though /ð/, còn lại /θ/"),
M("Chọn từ có trọng âm khác:",["remind","worker","collect","relax"],1,"worker nhấn âm 1, còn lại nhấn âm 2"),
F("Doing exercises regularly maintains your mental and ______ health. (PHYSICS)","physical","Cần tính từ bổ nghĩa cho health → physical"),
F("She speaks English ______ after living in Britain for several years. (FLUENT)","fluently","Cần trạng từ bổ nghĩa cho speaks → fluently")
],...E(9)]},
{t:"Dạng 2 – Đọc hiểu & Viết lại câu (Part C + D)",ex:[[
F("My sister doesn’t have a laptop to study online. → My sister wishes she ______.",["had a laptop to study online","had a laptop"],"Wish hiện tại → V quá khứ"),
F("If you don’t hurry up, you will miss the bus. → Unless ______.","you hurry up, you will miss the bus","Unless = If … not"),
F("My sister often collected dolls when she was young. (USED) → My sister ______.","used to collect dolls when she was young","used to + V nguyên mẫu")
],...E(9)]},
{t:"Dạng 3 – Đề thi (60 phút, 50 câu)",exam:1,ex:[[
M("She has a meeting ______ Monday, but I’m not sure.",["at","in","on","to"],2,"on + thứ"),
M("My grandmother doesn’t know ______ to use the washing machine.",["whom","what","how","which"],2,"know how to + V"),
M("What is the main idea of the passage?",["The importance of cell phones in communication and education.","Cell phones will be used as cameras.","How to use some electronic devices.","Cell phones can be an excellent recorder."],0,"Bài viết nói về vai trò của điện thoại trong giao tiếp và giáo dục",
"Cell phones are an important part of our society and their main use is communication. They keep students in touch with the rest of the world... Now, students have the ability to solve their own problems.")
],...E(9)]}]}
];
/* ===== ĐỘNG CƠ ===== */
const $=s=>document.querySelector(s);let T=0,CUR=null,TM=null,P={done:{}};
try{P=JSON.parse(localStorage.getItem("on10_2627"))||P}catch(e){}
const save=()=>{try{localStorage.setItem("on10_2627",JSON.stringify(P))}catch(e){}};
const flat=t=>{const r=[];DATA[t].groups.forEach((g,gi)=>g.ex.forEach((q,ei)=>q.length&&r.push({k:t+"."+gi+"."+ei,gi,ei,q,g})));return r};
const norm=s=>(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[.\s]+$/,"").replace(/\s+/g," ").trim();
function nav(){$("#nav").innerHTML=DATA.map((d,i)=>`<button class="${i==T&&!CUR?"on":""}" onclick="CUR=null;clearInterval(TM);T=${i};draw()">${d.name}</button>`).join("")}
function draw(){nav();CUR?play():home();scrollTo(0,0)}
function home(){const L=flat(T),st={};let open=true,dn=0;
 L.forEach(x=>{const d=P.done[x.k];dn+=d?1:0;st[x.k]=d?"done":open?"open":"lock";if(!d)open=false});
 $("#pb").style.width=(L.length?dn/L.length*100:0)+"%";
 $("#app").innerHTML=DATA[T].groups.map((g,gi)=>`<section class="g"><h2>${g.t} <small>(${g.ex.filter((_,ei)=>P.done[T+"."+gi+"."+ei]).length}/${g.ex.length} bài)</small></h2><div class="grid">`+
  g.ex.map((q,ei)=>{const k=T+"."+gi+"."+ei,s=q.length?st[k]:"soon",ic={done:"✅",open:"▶️",lock:"🔒",soon:"⏳"}[s];
  return `<button class="ex ${s}" ${s=="open"||s=="done"?`onclick="go('${k}')"`:"disabled"}>${ic}<br>${g.exam?"Đề":"Bài"} ${ei+1}</button>`}).join("")+`</div></section>`).join("")}
function go(k){CUR=flat(T).find(x=>x.k==k);draw()}
function play(){const x=CUR,Q=x.q;$("#pb").style.width="0";
 $("#app").innerHTML=`<div class="top"><button class="btn s" onclick="CUR=null;clearInterval(TM);draw()">← Quay lại</button><b>${x.g.t.split("–")[0]} · ${x.g.exam?"Đề":"Bài"} ${x.ei+1}</b><span id="tm"></span></div><div id="res"></div>`+
 Q.map((q,i)=>`<div class="q" id="q${i}">${q.p?`<div class="p">${q.p}</div>`:""}<span class="n">Câu ${i+1}.</span>${q.q}`+
  (q.o?q.o.map((o,j)=>`<button class="o" onclick="pick(${i},${j})">${"ABCD"[j]}. ${o}</button>`).join(""):`<input class="f" id="f${i}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Nhập đáp án..." oninput="cnt()">`)+`<div class="e" id="e${i}"></div></div>`).join("")+
 `<div class="fix"><span id="ct"></span><button class="btn" id="sub" onclick="submit()">Nộp bài</button></div>`;
 CUR.A=[];cnt();clearInterval(TM);
 if(x.g.exam){let s=3600;const t=()=>{$("#tm").textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s--<=0){clearInterval(TM);submit()}};t();TM=setInterval(t,1000)}}
function pick(i,j){CUR.A[i]=j;document.querySelectorAll("#q"+i+" .o").forEach((b,k)=>b.classList.toggle("sel",k==j));cnt()}
function cnt(){const n=CUR.q.filter((q,i)=>q.o?CUR.A[i]!=null:norm($("#f"+i)&&$("#f"+i).value)).length;$("#ct").textContent=n+"/"+CUR.q.length+" câu"}
function submit(){clearInterval(TM);let ok=0;
 CUR.q.forEach((q,i)=>{const el=$("#q"+i);let r;
  if(q.o){r=CUR.A[i]===q.a;el.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(k==q.a)b.classList.add("right");else if(k==CUR.A[i])b.classList.add("wrong")})}
  else{const f=$("#f"+i);f.disabled=true;r=q.a.map(norm).includes(norm(f.value))}
  ok+=r;el.classList.add(r?"ok":"no");$("#e"+i).innerHTML=(r?"✅ ":"❌ ")+(q.o?"":"<b>Đáp án: "+q.a[0]+"</b><br>")+(q.e||"")});
 const all=ok==CUR.q.length,L=flat(T),ix=L.findIndex(x=>x.k==CUR.k),nx=L[ix+1];
 if(all){P.done[CUR.k]=1;save()}
 $("#res").innerHTML=`<div class="res ${all?"ok":"no"}">${all?"🎉 Chính xác 100%! Bạn đã mở khoá bài tiếp theo.":`Đúng ${ok}/${CUR.q.length} câu. Cần đúng hết để qua bài – xem giải thích rồi làm lại nhé!`}</div>`;
 $("#sub").outerHTML=all?(nx?`<button class="btn" onclick="go('${nx.k}')">Bài tiếp theo →</button>`:`<button class="btn" onclick="CUR=null;draw()">Hoàn thành thẻ 🏆</button>`):`<button class="btn" onclick="go('${CUR.k}')">Làm lại</button>`;
 $("#ct").textContent="";scrollTo(0,0)}
draw();
</script></body></html>
