   Mỗi bài = mảng câu hỏi (20 câu). Bài rỗng [] = "Sắp có". Thêm {p:"đoạn văn"} vào câu đầu của đoạn để hiện bài đọc. */
const M=(q,o,a,e,p)=>({q,o,a,e,p}),F=(q,a,e,p)=>({q,a:[].concat(a),e,p}),E=n=>Array.from({length:n},()=>[]);

],...E(9)]},
{t:"Dạng 3 – Đề thi (60 phút, 50 câu)",exam:1,ex:[[
M("She has a meeting ______ Monday, but I’m not sure.",["at","in","on","to"],2,"on + thứ"),
M("My grandmother doesn’t know ______ to use the washing machine.",["whom","what","how","which"],2,"know how to + V"),

const ADD=(t,g,e,qs)=>DATA[t].groups[g].ex[e].push(...qs);

ADD(0,0,0,[

W("We (watch) ____ TV when the phone rang","were watching","Quá khứ tiếp diễn + when + quá khứ đơn"),

ex1=[

M("If I ______ rich, I would travel the world.",["am","were","will be","would be"],1),

W("I wish my brother (not/make) ____ so much noise",["didn't make","wouldn't make","did not make","would not make"]),

M("If I ______ a bird, I would fly to you.",["am","were","will be","have been"],1),
W("If he (not/hurry) ____, he will miss the bus",["doesn't hurry","does not hurry"]),

M("If you ______ water to 100°C, it boils.",["heat","heated","will heat","would heat"],0),
W("Unless she (study) ____ harder, she will fail","studies"),

M("If I had a car, I ______ you to school.",["take","will take","would take","would have taken"],2),
W("If we (not/protect) ____ the environment, the Earth will get hotter",["don't protect","do not protect"]),
M("I don't have a bike. → I wish I ______ a bike.",["have","had","will have","would have"],1)];
DATA[0].groups[1].ex[0]=ex1;

ADD(0,2,0,[

ADD(0,3,0,[

W("The (far) ____ you go, the colder it gets",["farther","further"]),

ADD(0,4,0,[

const $=s=>document.querySelector(s);let T=0,CUR=null,TM=null,P={done:{}};
try{P=JSON.parse(localStorage.getItem("on10_2627"))||P}catch(e){}
const save=()=>{try{localStorage.setItem("on10_2627",JSON.stringify(P))}catch(e){}};
const flat=t=>{const r=[];DATA[t].groups.forEach((g,gi)=>g.ex.forEach((q,ei)=>q.length&&r.push({k:t+"."+gi+"."+ei,gi,ei,q,g})));return r};
const norm=s=>(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[.\s]+$/,"").replace(/\s+/g," ").trim();
function nav(){$("#nav").innerHTML=DATA.map((d,i)=>`<button class="${i==T&&!CUR?"on":""}" onclick="CUR=null;clearInterval(TM);T=${i};draw()">${d.name}</button>`).join("")}
function draw(){nav();CUR?play():home();scrollTo(0,0)}
function home(){const L=flat(T),st={};let open=true,dn=0;
 L.forEach(x=>{const d=P.done[x.k];dn+=d?1:0;st[x.k]=d?"done":open?"open":"lock";if(!d)open=false});
 $("#pb").style.width=(L.length?dn/L.length*100:0)+"%";
 $("#app").innerHTML=DATA[T].groups.map((g,gi)=>`<section class="g"><h2>${g.t} <small>(${g.ex.filter((_,ei)=>P.done[T+"."+gi+"."+ei]).length}/${g.ex.length} bài)</small></h2><div class="grid">`+
  g.ex.map((q,ei)=>{const k=T+"."+gi+"."+ei,s=q.length?st[k]:"soon",ic={done:"✅",open:"▶️",lock:"🔒",soon:"⏳"}[s];
  return `<button class="ex ${s}" ${s=="open"||s=="done"?`onclick="go('${k}')"`:"disabled"}>${ic}<br>${g.exam?"Đề":"Bài"} ${ei+1}</button>`}).join("")+`</div></section>`).join("")}
function go(k){CUR=flat(T).find(x=>x.k==k);draw()}
function play(){const x=CUR,Q=x.q;$("#pb").style.width="0";
 $("#app").innerHTML=`<div class="top"><button class="btn s" onclick="CUR=null;clearInterval(TM);draw()">← Quay lại</button><b>${x.g.t.split("–")[0]} · ${x.g.exam?"Đề":"Bài"} ${x.ei+1}</b><span id="tm"></span></div><div id="res"></div>`+
 Q.map((q,i)=>`<div class="q" id="q${i}">${q.p?`<div class="p">${q.p}</div>`:""}<span class="n">Câu ${i+1}.</span>${q.q}`+
  (q.o?q.o.map((o,j)=>`<button class="o" onclick="pick(${i},${j})">${"ABCD"[j]}. ${o}</button>`).join(""):`<input class="f" id="f${i}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Nhập đáp án..." oninput="cnt()">`)+`<div class="e" id="e${i}"></div></div>`).join("")+
 `<div class="fix"><span id="ct"></span><button class="btn" id="sub" onclick="submit()">Nộp bài</button></div>`;
 CUR.A=[];cnt();clearInterval(TM);
 if(x.g.exam){let s=3600;const t=()=>{$("#tm").textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s--<=0){clearInterval(TM);submit()}};t();TM=setInterval(t,1000)}}
function pick(i,j){CUR.A[i]=j;document.querySelectorAll("#q"+i+" .o").forEach((b,k)=>b.classList.toggle("sel",k==j));cnt()}

 CUR.q.forEach((q,i)=>{const el=$("#q"+i);let r;
  if(q.o){r=CUR.A[i]===q.a;el.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(k==q.a)b.classList.add("right");else if(k==CUR.A[i])b.classList.add("wrong")})}

  ok+=r;el.classList.add(r?"ok":"no");$("#e"+i).innerHTML=(r?"✅ ":"❌ ")+(q.o?"":"<b>Đáp án: "+q.a[0]+"</b><br>")+(q.e||"")});
 const all=ok==CUR.q.length,L=flat(T),ix=L.findIndex(x=>x.k==CUR.k),nx=L[ix+1];
 if(all){P.done[CUR.k]=1;save()}
 $("#res").innerHTML=`<div class="res ${all?"ok":"no"}">${all?"🎉 Chính xác 100%! Bạn đã mở khoá bài tiếp theo.":`Đúng ${ok}/${CUR.q.length} câu. Cần đúng hết để qua bài – xem giải thích rồi làm lại nhé!`}</div>`;
 $("#sub").outerHTML=all?(nx?`<button class="btn" onclick="go('${nx.k}')">Bài tiếp theo →</button>`:`<button class="btn" onclick="CUR=null;draw()">Hoàn thành thẻ 🏆</button>`):`<button class="btn" onclick="go('${CUR.k}')">Làm lại</button>`;
 $("#ct").textContent="";scrollTo(0,0)}
draw();
